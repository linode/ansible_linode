- name: ip
  block:
    - set_fact:
        r: "{{ 1000000000 | random }}"

    - name: List all regions
      linode.cloud.region_list: {}
      register: all_regions

    - set_fact:
        region: '{{ ( all_regions.regions | selectattr("site_type", "equalto", "core") | list)[0].id }}'

    - name: Create a Linode Instance
      linode.cloud.instance:
        label: 'ansible-test-{{ r }}'
        region: "{{ region }}"
        type: g6-standard-1
        image: linode/arch
        root_pass: Fn$$oobar123
        state: present
        firewall_id: '{{ firewall_id }}'
      register: create_instance

    - name: Allocate a new IP to the Linode
      linode.cloud.ip:
        linode_id: '{{ create_instance.instance.id }}'
        public: true
        type: ipv4
        state: present
      register: allocate_ip

    - name: Assert changes
      assert:
        that:
          - allocate_ip.ip.linode_id == create_instance.instance.id
          - allocate_ip.ip.type == 'ipv4'
          - allocate_ip.ip.region == create_instance.instance.region

    - name: Delete allocated IP on the Linode
      linode.cloud.ip:
        address: '{{ allocate_ip.ip.address }}'
        state: absent
      register: delete_ip

    - name: Delete the IP again
      linode.cloud.ip:
        address: '{{ allocate_ip.ip.address }}'
        state: absent
      register: delete_ip_again

    - name: Assert IP has been deleted
      assert:
        that:
          - delete_ip.changed
          - delete_ip.ip.address == allocate_ip.ip.address
          - not delete_ip_again.changed
          - delete_ip_again.ip == none

    - name: Attempt to delete Linode last public IP
      linode.cloud.ip:
        address: '{{ create_instance.instance.ipv4[0] }}'
        state: absent
      register: delete_last_public_ip
      failed_when: >
        'failed to delete IP address' not in delete_last_public_ip.msg
        or 'Linode must have at least one public IP Address' not in delete_last_public_ip.msg

    - name: Allocate an IP for reserved IP tests
      linode.cloud.ip:
        linode_id: '{{ create_instance.instance.id }}'
        public: true
        type: ipv4
        state: present
      register: allocate_ip

    - name: Promote allocated IP to reserved
      linode.cloud.ip:
        address: '{{ allocate_ip.ip.address }}'
        reserved: true
        state: present
      register: promote_ip

    - name: Assert IP was promoted to reserved
      assert:
        that:
          - promote_ip.changed
          - promote_ip.ip.address == allocate_ip.ip.address
          - promote_ip.ip.reserved == true

    - name: Promote again (idempotency check)
      linode.cloud.ip:
        address: '{{ allocate_ip.ip.address }}'
        reserved: true
        state: present
      register: promote_ip_again

    - name: Assert no change on second promotion
      assert:
        that:
          - not promote_ip_again.changed

    - name: Apply tags to the reserved IP
      linode.cloud.ip:
        address: '{{ allocate_ip.ip.address }}'
        tags:
          - test-tag
        state: present
      register: tag_ip

    - name: Assert tags were applied
      assert:
        that:
          - tag_ip.changed
          - "'test-tag' in tag_ip.ip.tags"

    - name: Apply tags again (idempotency check)
      linode.cloud.ip:
        address: '{{ allocate_ip.ip.address }}'
        tags:
          - test-tag
        state: present
      register: tag_ip_again

    - name: Assert no change on second tag apply
      assert:
        that:
          - not tag_ip_again.changed

    - name: Delete reserved IP from the Linode
      linode.cloud.ip:
        address: '{{ allocate_ip.ip.address }}'
        state: absent
      register: delete_reserved_ip

    - name: Get the reserved IP after removing it from the Linode
      linode.cloud.reserved_ip_info:
        address: '{{ allocate_ip.ip.address }}'
      register: reserved_ip_after_delete

    - name: Assert IP was removed from the Linode but is still reserved
      assert:
        that:
          - delete_reserved_ip.changed
          - reserved_ip_after_delete.reserved_ip.reserved == true
          - reserved_ip_after_delete.reserved_ip.linode_id == none
          - "'test-tag' in reserved_ip_after_delete.reserved_ip.tags"

  always:
    - ignore_errors: true
      block:
        - name: Delete instance
          linode.cloud.instance:
            label: '{{ create_instance.instance.label }}'
            state: absent

        - name: Delete reserved IP
          linode.cloud.reserved_ip:
            address: '{{ allocate_ip.ip.address }}'
            state: absent
          when: allocate_ip.ip.address is defined

  environment:
    LINODE_UA_PREFIX: '{{ ua_prefix }}'
    LINODE_API_TOKEN: '{{ api_token }}'
    LINODE_API_URL: '{{ api_url }}'
    LINODE_API_VERSION: '{{ api_version }}'
    LINODE_CA: '{{ ca_file or "" }}'
